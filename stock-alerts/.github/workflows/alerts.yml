name: Drop Alert Checks

on:
  schedule:
    # Run frequently to catch intraday drops from day's high
    # Every 15 minutes during market hours (UTC). Adjust as needed.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run alert pipeline (news + Groq analysis + email)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DROP_THRESHOLD_PCT: ${{ secrets.DROP_THRESHOLD_PCT || '5' }}
          CONCISE_MODE: ${{ secrets.CONCISE_MODE || 'true' }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          MEDIASTACK_KEY: ${{ secrets.MEDIASTACK_KEY }}
          MAX_NEWS_PER_ALERT: ${{ secrets.MAX_NEWS_PER_ALERT || '10' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || 'neerajnishal@gmail.com' }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          python scripts/check_alerts.py